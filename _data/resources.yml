# Learning resources, shown on the Resources page as one column per track.
#
#   id:      used for links like /resources/#verification. Lowercase-with-dashes.
#   name:    column heading
#   intro:   one sentence under the heading
#   subteam: optional, the subteam id in _data/subteams.yml to link to
#   links:   articles, docs, wikis, and tutorials
#   videos:  lectures and recorded walkthroughs
#
# Each link or video has:
#   title:   what it's called
#   url:     full link. Leave it "" to show the item as "Coming soon".
#   source:  optional, who made it (e.g. "cocotb docs", "YouTube")
#   note:    optional, one short line on what it's good for
#   length:  videos only, optional, e.g. "45 min"
#
# To add a resource, copy a block (from "- title" down), paste it in the right
# list, and fill it in. Items appear in the order they're listed.

