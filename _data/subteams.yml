# The three subteams, shown on the Home page (short) and About page (full).
#
#   id:        used for links like /about/#physical-design. Lowercase-with-dashes.
#   short:     one sentence for the home page
#   image:     a photo in assets/images/subteams/ (JPG, PNG, or SVG).
#              Landscape images around 1200x900 look best; they're cropped to 4:3.
#   image_alt: describe the image for screen readers
#   link:      optional "learn more" link
#
# Leads aren't named here: they're listed in _data/officers.yml, so this file
# doesn't need to change when leadership does.

- id: architecture-asic-design
  name: Architecture & ASIC Design
  short: Defines what the chip does and how it does it, from microarchitecture to synthesizable RTL.
  description: >-
    Defines what the chip does and how it does it. Members choose the
    microarchitecture, write block specifications, and write synthesizable RTL
    tuned for power, performance, and area.
  learn:
    - Choosing a microarchitecture
    - Writing block specifications
    - Writing synthesizable SystemVerilog
    - Designing for power, performance, and area
  tools: [SystemVerilog]
  image: /assets/images/subteams/architecture.svg
  image_alt: A code editor showing the SystemVerilog source of our CPU's ALU.

- id: digital-verification
  name: Digital Verification
  short: Proves the design works before it's fabricated, with testbenches, regressions, and gate-level simulation.
  description: >-
    Proves the design works before it is fabricated. Members write
    self-checking testbenches, build regression suites, and run gate-level
    simulation to catch bugs before they are locked into silicon.
  learn:
    - Writing self-checking testbenches
    - Directed and randomized testing
    - Building regression suites
    - Gate-level simulation
  tools: [cocotb, GTKWave, Verdi, VCS]
  image: /assets/images/subteams/verification.svg
  image_alt: A waveform viewer showing SPI signals and a passing test.

- id: physical-design
  name: Physical Design
  short: Turns RTL into a manufacturable layout, from synthesis and place-and-route to signoff.
  description: >-
    Turns RTL into a manufacturable layout. Members synthesize in Cadence
    Genus, place and route in Innovus, close timing, and pass DRC and LVS
    before streaming out GDS. New members build their own place-and-route flow
    from a template.
  learn:
    - Logic synthesis and timing constraints
    - Floorplanning, placement, and clock tree synthesis
    - Routing and static timing analysis
    - Signoff checks (DRC and LVS) and GDS streamout
  tools: [Cadence Genus, Cadence Innovus, Calibre]
  image: /assets/images/subteams/physical-design-layout.jpg
  image_alt: A placed-and-routed chip layout, with rows of standard cells and dense metal routing.
