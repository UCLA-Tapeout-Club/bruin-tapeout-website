# Milestones shown on the Home and About pages, oldest first.
# Add a new entry at the bottom whenever something big happens.
# Set `current: true` on the milestone that is happening right now.

- date: Spring 2026
  title: Founded at UCLA
  text: A small group of students sets out to take a design all the way from RTL to silicon.

- date: Spring 2026
  title: First lines of RTL
  text: Work begins on a modified 8-bit RISC-V CPU, starting with the ALU, register file, and program counter.

- date: September 2026
  title: Our first tapeout
  text: The CPU is taped out on SkyWater 130 nm through Tiny Tapeout.

- date: Fall 2026
  title: Pilot program
  text: More than 40 undergraduates join to learn the full flow across three subteams, and capstone teams design their own CPUs.

- date: Now
  title: Chip in fabrication
  text: Our first chip is at the fab. Next up is our first full-scale tapeout, a low-power SoC on TSMC 65 nm.
  current: true
