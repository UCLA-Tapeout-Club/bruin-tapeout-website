# Projects, shown on the Projects page (newest first).
# The first project is also featured on the Home page.
#
#   id:            used for links like /projects/#riscv8. Lowercase-with-dashes.
#   status:        a few words, shown next to a colored dot
#   status_key:    the dot's color: design (blue) | fabrication (gold) | complete (green)
#   tagline:       one sentence (also used on the Home page)
#   summary:       one or two more sentences. Markdown works: **bold**, [links](https://...)
#   facts:         a few short facts, shown on one line
#   image:         a picture in assets/images/projects/ (optional)
#   image_alt:     describe the picture for screen readers
#   image_caption: one line under the picture (optional)
#   links:         buttons under the project; the first one is highlighted
#
# To add a project, copy the whole block below (from "- id" down), paste it
# ABOVE the existing one, and edit it.

- id: riscv8
  title: 8-bit Modified RISC-V CPU
  year: 2026
  status: Currently being fabricated
  status_key: fabrication
  tagline: Our first chip, a tiny RISC-V-inspired processor you program over SPI.
  summary: |
    We designed and verified it in SystemVerilog, then taped it out on
    SkyWater 130 nm through Tiny Tapeout in September 2026.
  facts:
    - SkyWater 130 nm
    - Tiny Tapeout SKY26c
    - 1×1 tile
    - SystemVerilog
  image: /assets/images/projects/riscv8-die.jpg
  image_alt: >-
    Layout of our chip's die area: rows of standard cells and metal wiring
    filling one Tiny Tapeout tile.
  image_caption: >-
    Our tile (161 × 112 µm) on the SKY26c die, rendered from the layout we
    submitted to Tiny Tapeout.
  links:
    - text: View on Tiny Tapeout
      url: https://tinytapeout.com/chips/ttsky26c/tt_um_spi_reg_bank
    - text: Source on GitHub
      url: https://github.com/UCLA-Tapeout-Club/risc_v_tt
