{%- comment -%}
  Title block at the top of inner pages. Reads `hero` from the page's front matter.
{%- endcomment -%}
<section class="page-hero">
  <div class="container">
    {%- if page.hero.eyebrow %}
    <p class="eyebrow">{{ page.hero.eyebrow }}</p>
    {%- endif %}
    <h1>{{ page.hero.title | default: page.title }}</h1>
    {%- if page.hero.lead %}
    <p class="lead">{{ page.hero.lead }}</p>
    {%- endif %}
  </div>
</section>
